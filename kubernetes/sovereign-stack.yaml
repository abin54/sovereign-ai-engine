apiVersion: v1
kind: Namespace
metadata:
  name: sovereign
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sovereign-config
  namespace: sovereign
data:
  REDIS_HOST: "redis-service"
---
apiVersion: v1
kind: Secret
metadata:
  name: sovereign-secrets
  namespace: sovereign
type: Opaque
data:
  # Base64 encoded secrets (e.g. 'openai-key')
  OPENAI_API_KEY: "Y29uZmlkZW50aWFs" 
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: sovereign
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: sovereign
spec:
  selector:
    app: redis
  ports:
  - protocol: TCP
    port: 6379
    targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: sovereign
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      containers:
      - name: orchestrator
        image: sovereign-engine:latest # Needs to be built and pushed
        command: ["uv", "run", "python", "-m", "orchestrator.main"]
        envFrom:
        - configMapRef:
            name: sovereign-config
        - secretRef:
            name: sovereign-secrets
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skills-security
  namespace: sovereign
spec:
  replicas: 2
  selector:
    matchLabels:
      app: skills-security
  template:
    metadata:
      labels:
        app: skills-security
    spec:
      containers:
      - name: skills-security
        image: sovereign-engine:latest
        command: ["uv", "run", "python", "-m", "skills_security.main"]
        envFrom:
        - configMapRef:
            name: sovereign-config
        env:
        - name: HEALTH_PORT_SECURITY
          value: "8080"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skills-ml
  namespace: sovereign
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skills-ml
  template:
    metadata:
      labels:
        app: skills-ml
    spec:
      containers:
      - name: skills-ml
        image: sovereign-engine:latest
        command: ["uv", "run", "python", "-m", "skills_ml.main"]
        envFrom:
        - configMapRef:
            name: sovereign-config
        env:
        - name: HEALTH_PORT_ML
          value: "8081"
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
