apiVersion: apps/v1
kind: Deployment
metadata:
  name: skills-ml
  namespace: sovereign
spec:
  replicas: 2
  selector:
    matchLabels:
      app: skills-ml
  template:
    metadata:
      labels:
        app: skills-ml
    spec:
      containers:
      - name: skills-ml
        image: sovereign-engine:latest
        command: ["python", "-m", "skills_ml.main"]
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        envFrom:
        - configMapRef:
            name: sovereign-config
        - secretRef:
            name: sovereign-secrets
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: skills-ml-hpa
  namespace: sovereign
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: skills-ml
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
