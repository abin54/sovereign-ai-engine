[project]
name = "orchestrator"
version = "0.1.0"
description = "Core orchestration engine for Sovereign AI"
readme = "README.md"
authors = [
    { name = "Abinash Sahu", email = "abinashsahu@example.com" }
]
requires-python = ">=3.10"
dependencies = [
    "shared",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "typer[all]",
    "pyyaml",
]

[project.scripts]
sovereign = "orchestrator.cli:app"

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"
