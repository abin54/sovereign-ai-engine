version: '3.9'

services:
  # --- Reverse Proxy / Gateway ---
  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - orchestrator
      - web-ui
    restart: always
    networks:
      - sovereign-net

  # --- Redis (Bus + Cache) ---
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-sovereign_secret} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-sovereign_secret}", "ping"]
      interval: 10s
    restart: always
    networks:
      - sovereign-net

  # --- Vector DB (Qdrant) ---
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always
    networks:
      - sovereign-net

  # --- Orchestrator ---
  orchestrator:
    build: .
    environment:
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-sovereign_secret}
      - QDRANT_HOST=qdrant
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    restart: unless-stopped
    networks:
      - sovereign-net

  # --- Skill Workers (Scalable) ---
  worker-security:
    build: .
    command: python -m skills_security.main
    environment:
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-sovereign_secret}
    depends_on:
      - redis
    deploy:
      replicas: 2
    networks:
      - sovereign-net

  worker-ml:
    build: .
    command: python -m skills_ml.main
    environment:
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-sovereign_secret}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - redis
    networks:
      - sovereign-net

  worker-memory:
    build: .
    command: python -m memory.main
    environment:
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-sovereign_secret}
      - QDRANT_HOST=qdrant
    depends_on:
      - redis
      - qdrant
    networks:
      - sovereign-net

  # --- Frontend Dashboard ---
  web-ui:
    build: ./interfaces/web-ui
    restart: unless-stopped
    networks:
      - sovereign-net

volumes:
  redis_data:
  qdrant_data:

networks:
  sovereign-net:
    driver: bridge
