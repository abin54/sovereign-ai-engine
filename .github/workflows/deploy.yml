name: Sovereign AI - Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          
      - name: Set up Python
        run: uv python install 3.12
        
      - name: Install dependencies
        run: uv sync --all-extras --dev
        
      - name: Run Tests
        run: uv run pytest --cov=packages --cov-report=xml
        
      - name: Security Scan (Bandit)
        run: |
          uv run bandit -r packages/ -ll || true
          uv run bandit -r packages/ -lll
          
      - name: Dependency Check (Safety)
        run: |
          uv run safety check

  build:
    needs: test-and-scan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      DOCKER_USER: ${{ secrets.DOCKER_USER }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Verify Secrets
        run: |
          if [ -z "$DOCKER_USER" ]; then
            echo "❌ ERROR: DOCKER_USER environment variable is empty"
          else
            echo "✅ DOCKER_USER is set"
          fi
          if [ -z "$DOCKER_PASSWORD" ]; then
            echo "❌ ERROR: DOCKER_PASSWORD environment variable is empty"
          else
            echo "✅ DOCKER_PASSWORD is set"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USER }}/sovereign-engine:latest
            ${{ secrets.DOCKER_USER }}/sovereign-engine:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
    steps:
      - name: Deploy to Production via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SSH_KEY }}
          script: |
            cd /opt/sovereign-ai
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
