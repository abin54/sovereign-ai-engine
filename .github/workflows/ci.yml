name: Sovereign CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/install.sh | sh
      
    - name: Sync workspace
      run: uv sync
      
    - name: Lint with ruff
      run: uv run ruff check .
      
    - name: Run tests
      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)/packages/shared/src
        uv run pytest packages/shared/tests
      
  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build and Push
      run: |
        docker build -t sovereign-engine:latest .
        # Note: In a real CI, we would push to a registry (GHCR, DockerHub)
        # docker push sovereign-engine:latest
