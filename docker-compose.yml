version: '3.8'

services:
  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - orchestrator
      - web-ui

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  orchestrator:
    build: .
    command: uv run python -m orchestrator.main
    environment:
      - REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - audit_data:/app/data

  skills-security:
    build: .
    command: uv run python -m skills_security.main
    environment:
      - REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/app

  skills-ml:
    build: .
    command: uv run python -m skills_ml.main
    environment:
      - REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/app

  skills-memory:
    build: .
    command: uv run python -m memory.main
    environment:
      - REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/app

  web-ui:
    build:
      context: ./interfaces/web-ui
    environment:
      - VITE_API_URL=http://localhost/api
    ports:
      - "5173:5173"

volumes:
  audit_data:
